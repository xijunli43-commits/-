<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2b33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="性能排行">
<title>手机性能排行</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<style>
  :root {
    --bg: #f2f2f7;
    --bg-grouped: #f2f2f7;
    --card: #ffffff;
    --sep: #c6c6c8;
    --sep-light: #e5e5ea;
    --label: #000000;
    --label-2: #3c3c43;
    --label-3: #8e8e93;
    --tint: #007aff;
    --tint-press: #005ecb;
    --green: #34c759;
    --orange: #ff9500;
    --red: #ff3b30;
    --bg-muted: #e9e9eb;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg-grouped);
    color: var(--label);
    font-size: 15px;
    line-height: 1.45;
    overscroll-behavior-y: none;
  }
  a { color: var(--tint); text-decoration: none; }
  button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: var(--tint); }
  input, select { font-family: inherit; font-size: 15px; }

  /* ===== Top bar ===== */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(242,242,247,0.92);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    padding-top: var(--safe-top);
    border-bottom: 0.5px solid var(--sep-light);
  }
  .topbar-row {
    display: flex; align-items: center; justify-content: space-between;
    height: 44px; padding: 0 12px;
  }
  .topbar-title { font-size: 17px; font-weight: 600; }
  .topbar-btn {
    min-width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--tint); padding: 0 8px;
  }
  .topbar-btn svg { width: 22px; height: 22px; }
  .topbar-btn:disabled { color: var(--label-3); }

  /* Segmented tabs */
  .tabs {
    display: flex; margin: 0 12px 8px; background: var(--bg-muted);
    border-radius: 9px; padding: 2px;
  }
  .tab {
    flex: 1; text-align: center; padding: 6px 0; border-radius: 7px;
    color: var(--label-2); font-weight: 500; font-size: 14px;
  }
  .tab.active { background: #fff; color: var(--label); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

  /* ===== Filter bar ===== */
  .filters {
    background: var(--bg-grouped);
    padding: 8px 12px 10px;
    position: sticky; top: calc(44px + var(--safe-top)); z-index: 40;
  }
  .search-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .search-box {
    flex: 1; display: flex; align-items: center; gap: 6px;
    background: #fff; border-radius: 10px; padding: 7px 10px;
  }
  .search-box svg { width: 16px; height: 16px; color: var(--label-3); flex: none; }
  .search-box input { flex: 1; border: none; outline: none; background: transparent; min-width: 0; }
  .chip-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 5px 12px; border-radius: 14px;
    background: #fff; color: var(--label-2); font-size: 13px;
    border: 0.5px solid var(--sep-light);
  }
  .chip.active { background: var(--tint); color: #fff; border-color: var(--tint); }
  .select-row { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .select-row select { width: 100%; }
  .select-row select {
    flex: 1; padding: 7px 8px; border-radius: 10px; border: 0.5px solid var(--sep-light);
    background: #fff; color: var(--label); min-width: 0;
  }

  /* ===== List ===== */
  .list-wrap { padding: 8px 12px calc(120px + var(--safe-bottom)); }
  .list-meta { font-size: 12px; color: var(--label-3); padding: 4px 4px 8px; }
  .card {
    background: var(--card); border-radius: 12px; padding: 12px;
    margin-bottom: 10px; display: flex; gap: 10px; align-items: flex-start;
  }
  .rank-badge {
    flex: none; width: 28px; height: 28px; border-radius: 8px;
    background: var(--bg-muted); color: var(--label-2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px;
  }
  .rank-badge.top1 { background: #ffd60a; color: #000; }
  .rank-badge.top2 { background: #c7c7cc; color: #000; }
  .rank-badge.top3 { background: #ffb340; color: #000; }
  .card-main { flex: 1; min-width: 0; }
  .card-title { font-size: 16px; font-weight: 600; }
  .card-sub { font-size: 12px; color: var(--label-3); margin-top: 2px; }
  .card-stats { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
  .stat { font-size: 12px; color: var(--label-2); }
  .stat b { color: var(--label); font-weight: 600; }
  .badge-ios, .badge-android {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-left: 6px;
    vertical-align: 1px;
  }
  .badge-ios { background: #000; color: #fff; }
  .badge-android { background: #34c759; color: #fff; }
  .compare-check {
    flex: none; align-self: center; width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid var(--sep); display: flex; align-items: center; justify-content: center;
    color: transparent;
  }
  .compare-check.checked { background: var(--tint); border-color: var(--tint); color: #fff; }
  .compare-check svg { width: 16px; height: 16px; }
  .gb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 8px; }
  .gb-cell { background: var(--bg-muted); border-radius: 8px; padding: 6px 8px; min-width: 0; }
  .gb-label { display: block; font-size: 10px; color: var(--label-3); margin-bottom: 2px; }
  .gb-val { display: block; font-size: 12px; color: var(--label); word-break: break-word; line-height: 1.35; }
  .gb-val b { font-weight: 600; }
  .gb-sample { color: var(--label-3); font-size: 10px; }
  .badge-chip { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--bg-muted); color: var(--label-2); margin-left: 6px; vertical-align: 1px; }
  .badge-warn { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #fff3cd; color: #664d03; border: 1px solid #ffc107; margin-left: 6px; vertical-align: 1px; }

  .sentinel { height: 20px; }
  .end-note { text-align: center; color: var(--label-3); font-size: 12px; padding: 16px 0; }

  /* ===== Floating compare bar ===== */
  .compare-bar {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--safe-bottom));
    background: #1c2b33; color: #fff; border-radius: 14px; padding: 10px 12px;
    display: none; align-items: center; gap: 10px; z-index: 60;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
  }
  .compare-bar.show { display: flex; }
  .compare-bar-names { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .compare-bar-names .chip-mini {
    display: inline-block; background: rgba(255,255,255,0.15); border-radius: 8px;
    padding: 2px 8px; margin-right: 4px; font-size: 11px;
  }
  .compare-bar-btn {
    background: var(--tint); color: #fff; border-radius: 10px; padding: 7px 14px; font-weight: 600; font-size: 14px;
  }
  .compare-bar-clear { color: #ff9f0a; padding: 7px 6px; font-size: 13px; }

  /* ===== Detail page ===== */
  .detail-wrap { padding: 12px 12px calc(40px + var(--safe-bottom)); }
  .detail-hero {
    background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px;
  }
  .detail-name { font-size: 20px; font-weight: 700; }
  .detail-sub { color: var(--label-3); font-size: 13px; margin-top: 4px; }
  .section {
    background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px;
  }
  .section h3 {
    margin: 0 0 8px; font-size: 13px; color: var(--label-3); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .kv { display: flex; justify-content: space-between; padding: 6px 0; border-top: 0.5px solid var(--sep-light); font-size: 14px; }
  .kv:first-of-type { border-top: none; }
  .kv .k { color: var(--label-3); flex: 0 0 38%; }
  .kv .v { color: var(--label); text-align: right; flex: 1; word-break: break-word; }
  .src-list { margin: 6px 0 0; padding-left: 18px; }
  .src-list li { margin: 4px 0; font-size: 13px; word-break: break-all; }
  .note-box { font-size: 12px; color: var(--label-3); background: var(--bg-muted); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }

  /* ===== Compare table ===== */
  .warn-banner {
    background: #fff3cd; border: 1px solid #ffc107; color: #664d03;
    padding: 10px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px;
  }
  table.cmp {
    width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden;
    font-size: 13px;
  }
  table.cmp th, table.cmp td {
    padding: 8px 8px; border-bottom: 0.5px solid var(--sep-light); text-align: left; vertical-align: top;
    word-break: break-word;
  }
  table.cmp thead th { background: var(--bg-muted); font-weight: 600; position: sticky; top: 0; }
  table.cmp td.dim { color: var(--label-3); }
  table.cmp tr.dim-row td:first-child { color: var(--label-3); font-weight: 600; background: var(--bg-muted); }
  .better { color: var(--green); font-weight: 700; }
  .cmp-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* ===== About ===== */
  .about p, .about li { font-size: 14px; color: var(--label-2); }
  .about ol, .about ul { padding-left: 20px; }
  .step-num {
    display: inline-block; width: 20px; height: 20px; border-radius: 50%; background: var(--tint);
    color: #fff; text-align: center; line-height: 20px; font-size: 12px; margin-right: 6px;
  }

  .toast {
    position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%);
    background: rgba(0,0,0,0.8); color: #fff; padding: 8px 16px; border-radius: 18px;
    font-size: 13px; z-index: 100; opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  @media (min-width: 720px) {
    body { font-size: 16px; }
    .select-row { flex-direction: row; }
    .select-row select { flex: 1; width: auto; }
    .list-wrap, .detail-wrap, .filters, .topbar-row { max-width: 760px; margin-left: auto; margin-right: auto; }
    .filters { left: 0; right: 0; }
    .compare-bar { max-width: 760px; left: 50%; transform: translateX(-50%); right: auto; width: 760px; }
  }
</style>
<style>
body{background:radial-gradient(ellipse at 20% 0%,#d8f3f5 0%,transparent 50%),#f2f6f8}
.topbar{background:rgba(250,253,255,.66);backdrop-filter:blur(28px) saturate(150%);border-bottom:1px solid #fff9}
.tabs{background:#d9e7ed88;border-radius:24px;padding:4px}.tab{border-radius:22px;min-height:40px}
.filters{background:#f2f6f8c9;backdrop-filter:blur(22px)}.search-box{border:1px solid #fff;border-radius:22px;min-height:44px}
.chip{min-height:36px;border-radius:20px}.card,.section{border-radius:20px;border:1px solid #e3ecf0;box-shadow:none}
.compare-bar{background:#ffffffb8;backdrop-filter:blur(30px) saturate(160%);border:1px solid #fff;border-radius:28px;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:auto}
button,select{min-height:44px}.card-title{font-weight:650}a:focus-visible,button:focus-visible{outline:3px solid #007aff;outline-offset:3px}
@media(prefers-reduced-transparency:reduce){.topbar,.filters,.compare-bar{background:#f8fafc;backdrop-filter:none}}
</style></head>
<body>
<!-- body: rendered by JS -->
<div id="root"></div>
<div class="toast" id="toast"></div>
<!-- APP_JS -->
<script src="data.js"></script>
<script>
'use strict';
/* ============ helpers ============ */
const DATA = window.PHONE_DATA;
const $ = (sel) => document.querySelector(sel);
const root = $('#root');

function fmt(v) {
  if (v === null || v === undefined || v === '') return '未查证';
  if (v === '未查证') return '未查证';
  if (typeof v === 'number') return v.toLocaleString('zh-CN');
  return String(v);
}
/* numeric display: integers with thousand separators; decimals kept as-is */
function fmtNum(v) {
  if (v === null || v === undefined || v === '') return '未查证';
  if (typeof v === 'number') {
    return Number.isInteger(v) ? v.toLocaleString('zh-CN') : v.toString();
  }
  return String(v);
}
function isNum(v) { return typeof v === 'number' && !isNaN(v); }
function getPhone(id) { return DATA.phones.find(p => String(p.id) === String(id)); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ============ state ============ */
const state = {
  tab: 'phones',         // phones | chips
  platform: 'all',       // all | android | ios
  brand: 'all',
  query: '',
  sort: 'antutu_total',
  chipCategory: 'all',   // all | phone | apple-a | apple-m
  page: 1,
  pageSize: 30,
  compare: [],           // phone ids
};

const PHONE_SORTS = [
  ['antutu_total', '安兔兔总分'],
  ['antutu_cpu',   '安兔兔 CPU'],
  ['antutu_gpu',   '安兔兔 GPU'],
  ['antutu_mem',   '安兔兔 MEM'],
  ['antutu_ux',    '安兔兔 UX'],
  ['gb6_single',   'GB6 单核'],
  ['gb6_multi',    'GB6 多核'],
  ['gb7_single',   'GB7 单核'],
  ['gb7_multi',    'GB7 多核'],
  ['body_weight',  '机身重量（轻→重）'],
  ['battery_capacity', '电池容量'],
  ['display_size', '屏幕尺寸'],
  ['display_refresh', '屏幕刷新率'],
];
const CHIP_SORTS = [
  ['total', '安兔兔总分'],
  ['cpu', '安兔兔 CPU'],
  ['gpu', '安兔兔 GPU'],
  ['gb6_single', 'GB6 单核'],
  ['gb6_multi', 'GB6 多核'],
  ['gb7_single', 'GB7 单核'],
  ['gb7_multi', 'GB7 多核'],
  ['release', '发布时间（新→旧）'],
  ['process', '工艺节点（新→旧）'],
];

function sortValue(p, key) {
  switch (key) {
    case 'antutu_total': return p.antutu.total;
    case 'antutu_cpu':   return p.antutu.cpu;
    case 'antutu_gpu':   return p.antutu.gpu;
    case 'antutu_mem':   return p.antutu.mem;
    case 'antutu_ux':    return p.antutu.ux;
    case 'body_weight':  return p.body.weight;
    case 'battery_capacity': return p.battery.capacity;
    case 'display_size': {
      const s = p.display.size;
      if (typeof s === 'number') return s;
      const m = String(s).match(/([\d.]+)/);
      return m ? parseFloat(m[1]) : null;
    }
    case 'display_refresh': return p.display.refresh;
    case 'gb6_single': return p.geekbench.gb6.single;
    case 'gb6_multi':  return p.geekbench.gb6.multi;
    case 'gb7_single': return p.geekbench.gb7.single;
    case 'gb7_multi':  return p.geekbench.gb7.multi;
    default: return null;
  }
}

function filteredPhones() {
  let list = DATA.phones.slice();
  if (state.platform !== 'all') list = list.filter(p => p.platform === state.platform);
  if (state.brand !== 'all') list = list.filter(p => p.brand === state.brand);
  if (state.query) {
    const q = state.query.trim().toLowerCase();
    if (q) {
      list = list.filter(p => {
        const hay = [p.brand, p.name, p.soc && p.soc.name, p.soc && p.soc.alias]
          .filter(Boolean).join(' ').toLowerCase();
        return hay.indexOf(q) !== -1;
      });
    }
  }
  const key = state.sort;
  const asc = (key === 'body_weight'); // weight ascending (lighter better)
  list.sort((a, b) => {
    let va = sortValue(a, key), vb = sortValue(b, key);
    if (!isNum(va) && !isNum(vb)) return 0;
    if (!isNum(va)) return 1;   // nulls sink
    if (!isNum(vb)) return -1;
    return asc ? va - vb : vb - va;
  });
  return list;
}

function processNodeNm(c) {
  const t = c.process;
  if (!t || t === '未查证') return null;
  const m = String(t).match(/(\d+(?:\.\d+)?)\s*nm/i);
  return m ? parseFloat(m[1]) : null;
}
function chipSortVal(c) {
  const at = c.antutu || {};
  switch (state.sort) {
    case 'chips_cpu': return isNum(at.cpu) ? at.cpu : null;
    case 'chips_gpu': return isNum(at.gpu) ? at.gpu : null;
    case 'chips_gb6_single': return (c.gb6 && isNum(c.gb6.single)) ? c.gb6.single : null;
    case 'chips_gb6_multi':  return (c.gb6 && isNum(c.gb6.multi)) ? c.gb6.multi : null;
    case 'chips_gb7_single': return (c.gb7 && isNum(c.gb7.single)) ? c.gb7.single : null;
    case 'chips_gb7_multi':  return (c.gb7 && isNum(c.gb7.multi)) ? c.gb7.multi : null;
    case 'chips_release': return c.releaseDate || null;   // string desc
    case 'chips_process': return processNodeNm(c);       // number asc (smaller=better)
    case 'chips_total':
    default: return isNum(at.total) ? at.total : null;
  }
}
function getChip(id) { return DATA.chips.find(c => String(c.id) === String(id)); }
function filteredChips() {
  let list = DATA.chips.slice();
  if (state.chipCategory && state.chipCategory !== 'all') {
    list = list.filter(c => c.category === state.chipCategory);
  }
  if (state.query) {
    const q = state.query.trim().toLowerCase();
    if (q) {
      list = list.filter(c => [c.name, c.vendor, c.process].join(' ').toLowerCase().indexOf(q) !== -1);
    }
  }
  const asc = (state.sort === 'chips_process'); // smaller nm = newer/better
  list.sort((a, b) => {
    const va = chipSortVal(a), vb = chipSortVal(b);
    const vaNum = isNum(va), vbNum = isNum(vb);
    // releaseDate is a string
    if (state.sort === 'chips_release') {
      if (!va && !vb) return 0;
      if (!va) return 1;
      if (!vb) return -1;
      return String(vb).localeCompare(String(va)); // newest first
    }
    if (!vaNum && !vbNum) return 0;
    if (!vaNum) return 1;
    if (!vbNum) return -1;
    return asc ? va - vb : vb - va;
  });
  return list;
}

function brandList() {
  const brands = {};
  DATA.phones.forEach(p => { brands[p.brand] = (brands[p.brand] || 0) + 1; });
  return Object.entries(brands).sort((a,b) => b[1]-a[1]).map(([b]) => b);
}

/* ============ SVG icons ============ */
const ICONS = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  chip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/><line x1="9" y1="2" x2="9" y2="6"/><line x1="15" y1="2" x2="15" y2="6"/><line x1="9" y1="18" x2="9" y2="22"/><line x1="15" y1="18" x2="15" y2="22"/><line x1="2" y1="9" x2="6" y2="9"/><line x1="2" y1="15" x2="6" y2="15"/><line x1="18" y1="9" x2="22" y2="9"/><line x1="18" y1="15" x2="22" y2="15"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
};

/* ============ router ============ */
function parseHash() {
  const h = location.hash || '#/';
  const parts = h.replace(/^#\//, '').split('/');
  return parts;
}
function currentView() {
  const parts = parseHash();
  if (parts[0] === '' || parts[0] === 'phones') return 'phones';
  if (parts[0] === 'chips') return 'chips';
  if (parts[0] === 'phone') return 'phoneDetail';
  if (parts[0] === 'chip') return 'chipDetail';
  if (parts[0] === 'compare') return 'compare';
  if (parts[0] === 'about') return 'about';
  return 'phones';
}

function render() {
  const view = currentView();
  if (view === 'phones') state.tab = 'phones';
  if (view === 'chips') state.tab = 'chips';
  state.page = 1;
  renderTopbar(view);
  if (view === 'phones') renderPhoneList();
  else if (view === 'chips') renderChipList();
  else if (view === 'phoneDetail') {
    const id = parseHash()[1];
    renderPhoneDetail(id);
  }
  else if (view === 'chipDetail') {
    const id = parseHash()[1];
    renderChipDetail(id);
  }
  else if (view === 'compare') renderCompare();
  else if (view === 'about') renderAbout();
  renderCompareBar();
  window.scrollTo(0, 0);
}

function renderTopbar(view) {
  const backViews = ['phoneDetail', 'chipDetail', 'compare', 'about'];
  let backBtn = '';
  if (backViews.includes(view)) {
    backBtn = '<button class="topbar-btn" id="backBtn" aria-label="返回">' + ICONS.back + '</button>';
  }
  let title = '手机性能排行';
  let tabsHtml = '';
  if (view === 'phones' || view === 'chips') {
    tabsHtml = `
      <div class="tabs">
        <button class="tab ${state.tab==='phones'?'active':''}" data-goto="#/">手机榜</button>
        <button class="tab ${state.tab==='chips'?'active':''}" data-goto="#/chips">芯片榜</button>
        <button class="tab" data-goto="#/about">关于</button>
      </div>`;
  }
  root.innerHTML = `
    <header class="topbar">
      <div class="topbar-row">
        ${backBtn}
        <div class="topbar-title">${escapeHtml(title)}</div>
        <button class="topbar-btn" data-goto="#/about" aria-label="关于">${ICONS.info}</button>
      </div>
      ${tabsHtml}
    </header>
    <main id="app"></main>
  `;
  // wire up
  const backEl = $('#backBtn');
  if (backEl) backEl.addEventListener('click', () => { history.back(); });
  root.querySelectorAll('[data-goto]').forEach(b => {
    b.addEventListener('click', () => { location.hash = b.getAttribute('data-goto'); });
  });
}

function refillList(reset) {
  const list = filteredPhones();
  const meta = $('#meta');
  if (meta) meta.textContent = `共 ${list.length} 款机型（数据：安兔兔 2026 年 8 月榜）`;
  const box = $('#list');
  if (!box) return;
  if (reset) { box.innerHTML = ''; state.page = 1; }
  appendPage(list);
}

function appendPage(all) {
  const box = $('#list');
  const start = (state.page - 1) * state.pageSize;
  const end = state.page * state.pageSize;
  const slice = all.slice(start, end);
  const html = slice.map(phoneCard).join('');
  box.insertAdjacentHTML('beforeend', html);
  // attach compare toggles
  box.querySelectorAll('[data-toggle-compare]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleCompare(btn.getAttribute('data-toggle-compare'));
    });
  });
  box.querySelectorAll('[data-goto-detail]').forEach(c => {
    c.style.cursor = 'pointer';
    c.addEventListener('click', () => { location.hash = '#/phone/' + c.getAttribute('data-goto-detail'); });
  });
  // end note
  const sentinel = $('#sentinel');
  if (end >= all.length) {
    if (sentinel) sentinel.innerHTML = '<div class="end-note">已加载全部 ' + all.length + ' 款</div>';
  } else {
    if (sentinel) sentinel.innerHTML = '<div class="end-note">下拉加载更多…</div>';
  }
  setupObserver(all);
}

function phoneCard(p) {
  const inCompare = state.compare.some(id => String(id) === String(p.id));
  const rank = isNum(p.rank) ? p.rank : '—';
  const platBadge = p.platform === 'ios'
    ? '<span class="badge-ios">iOS</span>'
    : '<span class="badge-android">安卓</span>';
  const at = p.antutu && isNum(p.antutu.total) ? p.antutu.total.toLocaleString('zh-CN') : '未查证';
  const gb6 = p.geekbench && p.geekbench.gb6;
  const gb6Txt = (gb6 && isNum(gb6.single)) ? `${gb6.single} / ${gb6.multi}` : '未查证';
  const w = isNum(p.body.weight) ? p.body.weight + 'g' : '未查证';
  const cap = isNum(p.battery.capacity) ? p.battery.capacity + 'mAh' : '未查证';
  return `
  <div class="card" data-goto-detail="${p.id}">

      <div class="card-sub">${escapeHtml(p.brand)} · ${escapeHtml(p.releaseDate || '未查证')} · ${escapeHtml(p.soc ? p.soc.name : '未查证')}</div>

      ${ICONS.check}
    </button>
  </div>`;
}

function setupObserver(all) {
  if (io) { io.disconnect(); io = null; }
  const sentinel = $('#sentinel');
  if (!sentinel) return;
  io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        const end = state.page * state.pageSize;
        if (end < all.length) {
          state.page++;
          appendPage(all);
        }
      }
    });
  }, { rootMargin: '200px 0px' });
  io.observe(sentinel);
}

/* ============ compare state ============ */
function toggleCompare(id) {
  id = String(id);
  const idx = state.compare.findIndex(x => String(x) === id);
  if (idx >= 0) {
    state.compare.splice(idx, 1);
    toast('已移出对比');
  } else {
    if (state.compare.length >= 3) {
      toast('最多对比 3 款机型');
      return;
    }
    state.compare.push(id);
    toast('已加入对比');
  }
  // refresh visible checkmarks + bar
  document.querySelectorAll(`[data-toggle-compare="${id}"]`).forEach(b => {
    b.classList.toggle('checked', state.compare.some(x => String(x) === id));
  });
  renderCompareBar();
}

function renderCompareBar() {
  let bar = $('#compareBar');
  if (state.compare.length === 0) {
    if (bar) bar.remove();
    return;
  }
  const names = state.compare.map(id => {
    const p = getPhone(id);
    return p ? `<span class="chip-mini">${escapeHtml(p.name)}</span>` : '';
  }).join('');
  if (!bar) {
    const div = document.createElement('div');
    div.id = 'compareBar';
    div.className = 'compare-bar show';
    document.body.appendChild(div);
    bar = div;
  }
  bar.classList.add('show');
  bar.innerHTML = `
    <div class="compare-bar-names">${names}</div>
    <button class="compare-bar-clear" id="cmpClear">清空</button>
    <button class="compare-bar-btn" data-goto-cmp>对比 (${state.compare.length})</button>
  `;
  bar.querySelector('#cmpClear').addEventListener('click', () => {
    state.compare = [];
    document.querySelectorAll('.compare-check.checked').forEach(b => b.classList.remove('checked'));
    renderCompareBar();
    toast('已清空对比');
  });
  bar.querySelector('[data-goto-cmp]').addEventListener('click', () => { location.hash = '#/compare'; });
}

/* ============ compare page ============ */
function renderCompare() {
  const app = $('#app');
  const phones = state.compare.map(getPhone).filter(Boolean);
  if (phones.length === 0) {
    app.innerHTML = `<div class="detail-wrap"><div class="section">
      <p>尚未选择对比机型。回到手机榜，点击机型右侧的圆形勾选按钮加入对比（最多 3 款）。</p>
      <p><button class="compare-bar-btn" id="goList">去选择</button></p>
    </div></div>`;
    $('#goList').addEventListener('click', () => { location.hash = '#/'; });
    return;
  }
  const hasAndroid = phones.some(p => p.platform === 'android');
  const hasIos = phones.some(p => p.platform === 'ios');
  const crossWarn = (hasAndroid && hasIos) ? `
    <div class="warn-banner">
      注意：当前对比机型跨安卓 / iOS 平台。安兔兔安卓榜与 iOS 榜为不同榜单、不同机型基数；
      Geekbench 6 与 Geekbench 7 的工具版本与计分口径也不同。分数之间不宜直接横向比较，仅供同平台/同版本内参考。
    </div>` : '';

  // dimension rows: [label, getVal(phone), direction('max'|'min'|null), unit]
  const rows = [
    ['dim', '基本信息', null, null],
    ['发布日期', p => p.releaseDate || '未查证', null, ''],
    ['平台', p => p.platform === 'ios' ? 'iOS' : 'Android', null, ''],
    ['SoC', p => (p.soc && p.soc.name) || '未查证', null, ''],
    ['制程', p => (p.soc && p.soc.process) || '未查证', null, ''],
    ['RAM', p => p.ram || '未查证', null, ''],
    ['dim', '安兔兔', null, null],
    ['CPU', p => p.antutu.cpu, 'max', ''],
    ['GPU', p => p.antutu.gpu, 'max', ''],
    ['MEM', p => p.antutu.mem, 'max', ''],
    ['UX', p => p.antutu.ux, 'max', ''],
    ['总分', p => p.antutu.total, 'max', ''],
    ['跑分期间', p => p.antutu.period || '未查证', null, ''],
    ['dim', 'Geekbench', null, null],
    ['GB6 单核', p => p.geekbench.gb6.single, 'max', ''],
    ['GB6 多核', p => p.geekbench.gb6.multi, 'max', ''],
    ['GB7 单核', p => p.geekbench.gb7.single, 'max', ''],
    ['GB7 多核', p => p.geekbench.gb7.multi, 'max', ''],
    ['dim', '机身', null, null],
    ['高', p => isNum(p.body.height) ? p.body.height + ' mm' : '未查证', null, ''],
    ['宽', p => isNum(p.body.width) ? p.body.width + ' mm' : '未查证', null, ''],
    ['厚', p => isNum(p.body.thickness) ? p.body.thickness + ' mm' : '未查证', null, ''],
    ['重量', p => p.body.weight, 'min', ' g'],
    ['防护', p => p.body.ip || '未查证', null, ''],
    ['dim', '屏幕', null, null],
    ['尺寸', p => String(p.display.size || '未查证'), null, ''],
    ['技术', p => p.display.tech || '未查证', null, ''],
    ['分辨率', p => p.display.resolution || '未查证', null, ''],
    ['刷新率', p => p.display.refresh, 'max', ' Hz'],
    ['dim', '影像', null, null],
    ['主摄', p => p.camera.main || '未查证', null, ''],
    ['超广角', p => p.camera.ultrawide || '未查证', null, ''],
    ['长焦', p => p.camera.tele || '未查证', null, ''],
    ['前摄', p => p.camera.front || '未查证', null, ''],
    ['dim', '马达 / 扬声器', null, null],
    ['振动马达', p => p.haptics.motor || '未查证', null, ''],
    ['扬声器', p => p.audio.speakers || '未查证', null, ''],
    ['dim', '电池 / 充电', null, null],
    ['电池容量', p => p.battery.capacity, 'max', ' mAh'],
    ['有线充电', p => p.battery.wired, 'max', ' W'],
    ['无线充电', p => p.battery.wireless === 0 ? '不支持' : (isNum(p.battery.wireless) ? p.battery.wireless + ' W' : '未查证'), null, ''],
    ['反向充电', p => p.battery.reverse === 0 ? '不支持' : (p.battery.reverse ? '支持' : '未查证'), null, ''],
    ['dim', '特色', null, null],
    ['特色', p => (p.features || []).join('、') || '未查证', null, ''],
  ];

  function cellHtml(rowDef, p) {
    const [label, getter, dir, unit] = rowDef;
    if (rowDef[0] === 'dim') return '';
    const v = getter(p);
    if (v === null || v === undefined || v === '' || v === '未查证') return '未查证';
    if (isNum(v)) return fmtNum(v) + (unit || '');
    return escapeHtml(String(v));
  }
  function bestIdx(rowDef) {
    const [, getter, dir] = rowDef;
    if (!dir) return -1;
    const vals = phones.map(p => getter(p));
    const nums = vals.map(v => isNum(v) ? v : null);
    if (nums.every(v => v === null)) return -1;
    let best = -1;
    for (let i = 0; i < nums.length; i++) {
      if (nums[i] === null) continue;
      if (best === -1) best = i;
      else if (dir === 'max' && nums[i] > nums[best]) best = i;
      else if (dir === 'min' && nums[i] < nums[best]) best = i;
    }
    return best;
  }

  const headCells = phones.map(p => `
    <th>
      <div>${escapeHtml(p.name)}</div>
      <div style="font-weight:400;font-size:11px;color:var(--label-3);margin-top:2px">
        ${escapeHtml(p.brand)} · ${p.platform === 'ios' ? 'iOS' : 'Android'}
      </div>
      <div style="margin-top:6px">
        <button class="chip" data-remove="${p.id}" style="font-size:11px;padding:2px 8px">移除</button>
      </div>
    </th>`).join('');

  const bodyRows = rows.map(r => {
    if (r[0] === 'dim') {
      return `<tr class="dim-row"><td colspan="${phones.length + 1}">${escapeHtml(r[1])}</td></tr>`;
    }
    const bi = bestIdx(r);
    const cells = phones.map((p, i) => {
      const cls = (i === bi) ? ' class="better"' : '';
      return `<td${cls}>${cellHtml(r, p)}</td>`;
    }).join('');
    return `<tr><td class="dim">${escapeHtml(r[0])}</td>${cells}</tr>`;
  }).join('');

  app.innerHTML = `
  <div class="detail-wrap">
    ${crossWarn}
    <div style="margin-bottom:10px;display:flex;gap:8px">
      <button class="chip" id="cmpBack">返回榜单</button>
      <button class="chip" id="cmpClearAll">清空全部</button>
    </div>
    <div class="cmp-wrap">
      <table class="cmp">
        <thead><tr><th style="width:22%">维度</th>${headCells}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>
    <p style="font-size:12px;color:var(--label-3);margin-top:10px">
      绿色加粗为该维度中更优者（重量为更轻更优，其余数值为更大更优）；文本维度不做优劣判定。
    </p>
  </div>
  `;
  app.querySelectorAll('[data-remove]').forEach(b => {
    b.addEventListener('click', () => {
      const id = b.getAttribute('data-remove');
      state.compare = state.compare.filter(x => String(x) !== String(id));
      renderCompare(); renderCompareBar();
      toast('已移除一款');
    });
  });
  $('#cmpBack').addEventListener('click', () => { location.hash = '#/'; });
  $('#cmpClearAll').addEventListener('click', () => {
    state.compare = [];
    renderCompare(); renderCompareBar();
    toast('已清空对比');
  });
}

function renderAbout() {
  const app = $('#app');
  const mlist = DATA.methodology.map(m => `<li>${escapeHtml(m)}</li>`).join('');
  const slist = DATA.sources.map(s => `<li><a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.label)}</a></li>`).join('');
  app.innerHTML = `
  <div class="detail-wrap about">
    <div class="section">
      <h3>安装到 iPhone 主屏幕（PWA）</h3>
      <p>本应用为离线 PWA（渐进式网页应用），在 iPhone 上通过 Safari「添加到主屏幕」安装：</p>
      <ol>
        <li><span class="step-num">1</span>用 <b>Safari</b>（必须是 Safari，微信/Chrome 内打开无法安装）打开本应用的 HTTPS 网址。</li>
        <li><span class="step-num">2</span>点击底部 <b>分享</b> 按钮（方框向上箭头图标）。</li>

      </ol>
      <div class="note-box">
        注意：iOS Safari 仅在 <b>HTTPS</b>（或 localhost）地址下才会注册 service worker 并支持离线安装。
        直接双击 index.html 以 <code>file://</code> 打开时，service worker 与离线缓存不可用——但 data.js 经 &lt;script&gt; 标签加载，
        普通浏览、搜索、筛选、对比均可在 file:// 下正常使用，仅下次启动不联网时无法打开已缓存页面。
        推荐托管到 GitHub Pages / Cloudflare Pages 等任意静态 HTTPS 服务后再安装。
      </div>
    </div>

    <div class="section">
      <h3>覆盖范围</h3>
      <ul>
        <li>机型共 <b>${DATA.counts.total}</b> 款：安卓 <b>${DATA.counts.android}</b> 款（安兔兔 2026 年 8 月安卓性能榜全量）；iPhone <b>${DATA.counts.ios}</b> 款（其中 31 款有安兔兔 iOS 榜成绩，早期机型跑分留空；含 2026-09 发布的 iPhone 18 Pro / 18 Pro Max / iPhone Duo）。</li>
        <li>芯片共 <b>${DATA.chips.length}</b> 款：手机 SoC ${DATA.chips.filter(c=>c.category==='phone').length} / Apple A 系列 ${DATA.chips.filter(c=>c.category==='apple-a').length} / Apple M 系列 ${DATA.chips.filter(c=>c.category==='apple-m').length}（M 系列适用 Mac/iPad，非手机芯片）。</li>
        <li>数据生成时间：${escapeHtml(DATA.generatedAt)}。</li>
      </ul>
    </div>

    <div class="section">
      <h3>口径说明</h3>
      <ol>${mlist}</ol>
      <div class="note-box">
        本数据集为人工整理的快照，<b>不暗示全网无遗漏</b>：部分早期机型、小众品牌、未上市工程机可能未收录；
        标注「未查证」的字段表示未找到可靠来源，未做推测或编造。跑分随厂商系统更新波动，仅供参考，不构成购买建议。
      </div>
    </div>

    <div class="section">
      <h3>主要数据来源</h3>
      <ul class="src-list">${slist}</ul>
      <p style="margin-top:8px">SoC 榜来源：<a href="${escapeHtml(DATA.socSource.source)}" target="_blank" rel="noopener">安兔兔 SoC 天梯榜（${escapeHtml(DATA.socSource.period)}）</a></p>
    </div>
  </div>
  `;
}

/* ============ SW registration ============ */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((e) => {
      console.warn('SW registration failed:', e);
    });
  });
} else {
  console.info('Service worker skipped (file:// or unsupported). Offline install requires HTTPS hosting.');
}

/* ============ boot ============ */
window.addEventListener('hashchange', render);
render();
